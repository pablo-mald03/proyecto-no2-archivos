<div class="flex h-screen w-full overflow-hidden bg-background text-text">

  <div class="hidden shrink-0 lg:flex lg:h-full">
    <app-sidebar
    class="h-full flex flex-col"
    [collapsed]="sidebarCollapsed()"
    (toggle)="toggleSidebar()"
    (logoutClicked)="logout()"
    />
  </div>

  <div class="flex min-w-0 flex-1 flex-col h-full overflow-hidden">

    <app-topbar
      (menuToggle)="toggleMobileSidebar()"
    />

    <main class="min-w-0 flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
      <router-outlet />
    </main>

  </div>

  <app-mobile-sidebar
    [open]="mobileSidebarOpen()"
    (closed)="closeMobileSidebar()"
    (logoutClicked)="logout()"
  />

</div>
