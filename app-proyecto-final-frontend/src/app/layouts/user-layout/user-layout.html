<div class="flex h-screen w-full overflow-hidden bg-background text-text">

  <div class="hidden shrink-0 lg:flex lg:h-full">
    <app-drive-sidebar [collapsed]="sidebarCollapsed()" (toggle)="toggleSidebar()" (uploadClicked)="uploadFile()"
      (folderClicked)="createFolder()" (logoutClicked)="logout()" />
  </div>

  <div class="flex h-full min-w-0 flex-1 flex-col overflow-hidden">

    <app-topbar (menuToggle)="toggleMobileSidebar()" />

    <main class="min-w-0 flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
      <router-outlet />
    </main>

  </div>

  <app-drive-mobile-sidebar [open]="mobileSidebarOpen()" (closed)="closeMobileSidebar()" (uploadClicked)="uploadFile()"
    (folderClicked)="createFolder()" (logoutClicked)="logout()" />

</div>
