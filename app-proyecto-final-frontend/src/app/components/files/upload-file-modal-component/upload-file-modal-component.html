<app-custom-modal-component [isOpen]="isOpen()" title="Subir Archivo"
    subtitle="Sube archivos de Texto o Markdown" maxWidth="md" (closed)="close()">
    <div class="flex flex-col gap-5">

        <div class="relative flex flex-col items-center justify-center rounded-2xl border-2 border-dashed p-8 text-center transition-all duration-200"
            [class.border-primary]="isDragging()" [class.bg-primary/5]="isDragging()"
            [class.border-border]="!isDragging()" [class.hover:border-primary/50]="!isDragging()"
            [class.hover:bg-surface-raised/50]="!isDragging()" (dragover)="onDragOver($event)"
            (dragleave)="onDragLeave($event)" (drop)="onDrop($event)">
            <input type="file" #fileInput class="absolute inset-0 h-full w-full opacity-0 cursor-pointer"
                accept=".txt,.md" (change)="onFileSelected($event)" />

            <div
                class="flex h-14 w-14 items-center justify-center rounded-2xl bg-primary/10 text-primary mb-4 transition-transform duration-200 group-hover:scale-110">
                <ng-icon [svg]="lucideCloudUploadIcon" size="28" />
            </div>

            <p class="font-medium text-text">
                Arrastra tu archivo aquí o <span
                    class="text-primary underline underline-offset-2 cursor-pointer">examina</span>
            </p>
        </div>

        @if (selectedFile()) {
        <div class="flex items-center justify-between rounded-xl border border-border bg-surface-raised px-4 py-3">
            <div class="flex items-center gap-3 min-w-0">
                <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-primary/10 text-primary">
                    <ng-icon [svg]="lucideFileTextIcon" size="20" />
                </div>
                <div class="min-w-0">
                    <p class="truncate text-sm font-medium text-text">{{ selectedFile()?.name }}</p>
                    <p class="text-xs text-text-muted">{{ formatFileSize(selectedFile()?.size || 0) }}</p>
                </div>
            </div>
            <button type="button" (click)="selectedFile.set(null)"
                class="rounded-lg p-1.5 text-text-muted hover:bg-surface hover:text-error transition-colors">
                <ng-icon [svg]="lucideXIcon" size="18" />
            </button>
        </div>
        }

        <div class="flex items-center justify-end gap-3 pt-2">
            <app-custom-button label="Cancelar" variant="ghost" (clicked)="close()" />
            <app-custom-button label="Subir archivo" [disabled]="!selectedFile()" (clicked)="confirmUpload()" />
        </div>

    </div>
</app-custom-modal-component>
