<div class="flex flex-col gap-2 pt-2 border-t border-border/40">
  <div class="flex items-center justify-between">
    <h3 class="text-xs font-bold text-text-muted uppercase tracking-wider px-1">
      Acceso general
    </h3>

    <app-custom-button label="Copiar enlace" variant="secondary" size="sm" [icon]="lucideLinkIcon" [bordered]="true"
      (clicked)="copyLinkClicked.emit()" />
  </div>

  <div
    class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-3 rounded-2xl bg-surface-raised/40 border border-border/50">
    <div class="flex items-center gap-3 min-w-0 flex-1">
      <div
        [class]="isPublic()
        ? 'flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl bg-emerald-500/15 text-emerald-500 ring-1 ring-emerald-500/20'
        : 'flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl bg-surface-raised text-text-muted ring-1 ring-border/50'">
        <ng-icon [svg]="isPublic() ? lucideGlobeIcon : lucideLockIcon" size="20" />
      </div>

      <div class="min-w-0 flex-1">
        <div class="w-64">
          <app-custom-dropdown [options]="modeOptions" optionKey="value" optionLabel="label" [control]="modeControl"
            size="sm" />
        </div>

        <p class="text-[11px] text-text-muted mt-1 truncate">
          @if (isPublic()) {
          Cualquier persona en Internet con este enlace puede acceder.
          } @else {
          Solo las personas con acceso concedido pueden abrir este elemento.
          }
        </p>
      </div>
    </div>

    @if (isPublic()) {
    <div class="shrink-0 self-end sm:self-center">
      <div class="w-36">
        <app-custom-dropdown [options]="accessOptions" optionKey="value" optionLabel="label" [control]="accessControl"
          size="sm" />
      </div>
    </div>
    }
  </div>
</div>
