<app-custom-card [hoverable]="true">

    <div class="flex items-start gap-4">

        <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-primary/10 text-primary">
            <ng-icon [svg]="lucideKeyIcon" size="24" />
        </div>

        <div class="min-w-0 flex-1">

            <h2 class="truncate text-lg font-semibold text-text">
                {{ permission().action }}
            </h2>

            <p class="mt-1 text-xs font-medium uppercase tracking-wide text-text-muted">
                {{ permission().module }}
            </p>

        </div>

    </div>

    <div class="mt-5">

        <p class="min-h-12 text-sm leading-6 text-text-muted">
            {{ permission().description || 'Sin descripción disponible.' }}
        </p>

    </div>

</app-custom-card>
