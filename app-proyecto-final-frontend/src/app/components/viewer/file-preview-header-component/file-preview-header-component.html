<header
  class="flex h-16 shrink-0 items-center justify-between border-b border-white/10 px-4 bg-neutral-900/60 backdrop-blur-lg"
  (click)="$event.stopPropagation()">

  <div class="flex items-center gap-3 min-w-0 flex-1">
    <button type="button" (click)="close.emit()"
      class="rounded-xl p-2 text-white/70 hover:bg-white/10 hover:text-white transition-colors"
      title="Cerrar previsualización">
      <ng-icon [svg]="lucideXIcon" size="22" />
    </button>

    <div class="flex items-center gap-2.5 min-w-0">
      <h2 class="truncate font-semibold text-white text-base">
        {{ fileName() }}
      </h2>

      @if (isRouted()) {
      @if (isOwner()) {
      <span
        class="shrink-0 rounded-full bg-primary/20 border border-primary/40 px-2.5 py-0.5 text-[11px] font-semibold text-primary">
        Propietario
      </span>
      } @else if (accessLevel() === 'EDITOR') {
      <span
        class="shrink-0 rounded-full bg-emerald-500/20 border border-emerald-500/40 px-2.5 py-0.5 text-[11px] font-semibold text-emerald-400">
        Editor
      </span>
      } @else if (accessLevel() === 'COMMENTER') {
      <span
        class="shrink-0 rounded-full bg-amber-500/20 border border-amber-500/40 px-2.5 py-0.5 text-[11px] font-semibold text-amber-400">
        Comentador
      </span>
      } @else {
      <span
        class="shrink-0 rounded-full bg-neutral-600/30 border border-neutral-500/30 px-2.5 py-0.5 text-[11px] font-semibold text-neutral-300">
        Solo lectura
      </span>
      }
      }
    </div>
  </div>

  <div class="hidden md:flex items-center gap-2 rounded-2xl bg-white/5 p-1 border border-white/10">
    <button type="button" (click)="zoomOut.emit()"
      class="rounded-xl p-1.5 text-white/70 hover:bg-white/10 hover:text-white transition-colors" title="Alejar">
      <ng-icon [svg]="lucideZoomOutIcon" size="18" />
    </button>

    <button type="button" (click)="zoomReset.emit()"
      class="px-2 text-xs font-mono font-medium text-white/80 hover:text-white" title="Restablecer zoom">
      {{ zoomLevel() }}%
    </button>

    <button type="button" (click)="zoomIn.emit()"
      class="rounded-xl p-1.5 text-white/70 hover:bg-white/10 hover:text-white transition-colors" title="Acercar">
      <ng-icon [svg]="lucideZoomInIcon" size="18" />
    </button>

    @if (canEdit()) {
    <div class="h-4 w-px bg-white/20 mx-1"></div>

    <button type="button" (click)="toggleEdit.emit()"
      class="flex items-center gap-1.5 rounded-xl px-3 py-1.5 text-xs font-medium transition-all"
      [class.bg-primary]="isEditMode()" [class.text-white]="isEditMode()" [class.text-white/70]="!isEditMode()"
      [class.hover:bg-white/10]="!isEditMode()" title="Alternar modo edición">
      <ng-icon [svg]="isEditMode() ? lucideEyeIcon : lucideEditIcon" size="16" />
      <span>{{ isEditMode() ? 'Modo Lectura' : 'Editar' }}</span>
    </button>

    @if (isEditMode()) {
    <app-custom-button label="Guardar" size="sm" [icon]="lucideSaveIcon" [loading]="saving()" (clicked)="save.emit()" />
    }
    }
  </div>

  <div class="flex items-center gap-1.5 flex-1 justify-end">

    <button type="button" (click)="toggleComments.emit()" class="relative rounded-xl p-2 transition-colors"
      [class.bg-primary/20]="isCommentsOpen()" [class.text-primary]="isCommentsOpen()"
      [class.text-white/70]="!isCommentsOpen()" [class.hover:bg-white/10]="!isCommentsOpen()" title="Ver comentarios">
      <ng-icon [svg]="lucideMessageSquareIcon" size="20" />
      @if (commentsCount() > 0) {
      <span class="absolute top-1 right-1 h-2 w-2 rounded-full bg-primary"></span>
      }
    </button>

    @if (isOwner()) {
    <button type="button" (click)="toggleActivity.emit()" class="relative rounded-xl p-2 transition-colors"
      [class.bg-primary/20]="isActivityOpen()" [class.text-primary]="isActivityOpen()"
      [class.text-white/70]="!isActivityOpen()" [class.hover:bg-white/10]="!isActivityOpen()"
      title="Ver historial de actividad">
      <ng-icon [svg]="lucideHistoryIcon" size="20" />
    </button>
    }

    <button type="button" (click)="openNewTab.emit()"
      class="rounded-xl p-2 text-white/70 hover:bg-white/10 hover:text-white transition-colors"
      title="Abrir en una pestaña nueva">
      <ng-icon [svg]="lucideExternalLinkIcon" size="20" />
    </button>

    @if (canShare()) {
    <app-custom-button label="Compartir" size="sm" variant="secondary" [bordered]="true" [icon]="lucideShareIcon"
      (clicked)="share.emit()" />
    }

    <app-custom-button label="Descargar" size="sm" [icon]="lucideDownloadIcon" (clicked)="download.emit()" />
  </div>

</header>
