<div class="flex h-full min-h-0 flex-col gap-6">

  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-xl font-bold text-text">
        @if (isInsideFolder()) { Contenido } @else { Mis Documentos }
      </h2>
    </div>
    <div class="flex items-center gap-3">
      <app-custom-button label="Nueva carpeta" variant="secondary" size="md" [icon]="lucideFolderPlusIcon"
        [bordered]="true" (clicked)="openCreateFolderModal()" />
      <app-custom-button label="Subir archivo" size="md" [icon]="lucidePlusIcon" (clicked)="openUploadModal()" />
    </div>
  </div>

  <app-custom-card [hoverable]="false">
    <button type="button" class="flex w-full items-center justify-between gap-3 text-left"
      [attr.aria-expanded]="filtersExpanded()" (click)="filtersExpanded.set(!filtersExpanded())">

      <div class="flex min-w-0 items-center gap-3">
        <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-primary/10 text-primary">
          <ng-icon [svg]="lucideSlidersHorizontalIcon" size="16" />
        </div>

        <div class="min-w-0">
          <h3 class="text-sm font-semibold text-text">
            Filtros de búsqueda
          </h3>
        </div>
      </div>

      <ng-icon [svg]="lucideChevronDownIcon" size="18"
        class="shrink-0 text-text-muted transition-transform duration-200" [class.rotate-180]="filtersExpanded()" />
    </button>

    @if (filtersExpanded()) {
    <div class="mt-4 border-t border-border pt-4">
      <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
        <app-custom-textfield label="Filtrar archivos" placeholder="Nombre del archivo..." [control]="searchControl"
          [icon]="lucideSearchIcon" [clearable]="true" />
      </div>
    </div>
    }
  </app-custom-card>


  @switch (emptyStateType()) {
  @case ('loading') {
  <app-empty-state-component [loading]="true" loadingText="Cargando tus documentos..." />
  }

  @case ('folder-empty') {
  <app-empty-state-component title="Esta carpeta está vacía"
    description="No hay archivos ni carpetas en este directorio. ¡Sube tu primer archivo o crea una carpeta para comenzar!">
    <div class="flex items-center gap-2">
      <app-custom-button label="Nueva carpeta" variant="secondary" size="sm" [icon]="lucideFolderPlusIcon"
        [bordered]="true" (clicked)="openCreateFolderModal()" />
      <app-custom-button label="Subir archivo" size="sm" [icon]="lucidePlusIcon" (clicked)="openUploadModal()" />
    </div>
  </app-empty-state-component>
  }

  @case ('search-empty') {
  <app-empty-state-component title="Sin resultados en la búsqueda"
    description="No encontramos ningún archivo o carpeta que coincida con lo que estás buscando." />
  }

  @default {
  <app-custom-infinite-scroll class="min-h-0 flex-1 overflow-y-auto pr-2" [loading]="loading()" [hasMore]="hasMore()"
    (loadMore)="loadMore()">

    <app-drive-item-list-component [items]="items()" (shareClicked)="onShare($event)"
      (previewClicked)="onPreview($event)" (downloadClicked)="onDownload($event)" (deleteClicked)="onDelete($event)"
      (renameClicked)="onRename($event)" (moveClicked)="onMoveItem($event)" (itemDoubleClicked)="onOpenItem($event)"
      (itemClicked)="onOpenItem($event)" (itemDropped)="handleItemDrop($event)" />

  </app-custom-infinite-scroll>
  }
  }

  <app-upload-file-modal-component [isOpen]="isUploadModalOpen()" (closed)="closeUploadModal()"
    (filesUploaded)="handleFilesUpload($event)" />

  <app-folder-modal-component [isOpen]="isFolderModalOpen()" [mode]="folderModalMode()" [itemType]="folderItemType()"
    [initialName]="folderInitialName()" (closed)="closeFolderModal()" (submitted)="handleFolderSubmit($event)" />

  <app-drive-move-modal-component [isOpen]="isMoveModalOpen()" [itemToMove]="itemToMove()" (closed)="closeMoveModal()"
    (targetSelected)="handleMoveTargetSelected($event)" />

</div>
