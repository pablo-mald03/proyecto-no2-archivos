<div class="flex h-full min-h-0 flex-col gap-6">

  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h1 class="text-2xl font-bold text-text">
        Mis Documentos
      </h1>
      <p class="mt-1 text-sm text-text-muted">
        Gestiona tus archivos markdown y de texto de forma segura.
      </p>
    </div>

    <app-custom-button label="Subir archivo" [icon]="lucidePlusIcon" (clicked)="uploadFile()" />
  </div>

  <app-custom-card [hoverable]="false">
    <button type="button" class="flex w-full items-center justify-between gap-3 text-left"
      [attr.aria-expanded]="filtersExpanded()" (click)="filtersExpanded.set(!filtersExpanded())">

      <div class="flex min-w-0 items-center gap-3">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-primary/10 text-primary">
          <ng-icon [svg]="lucideSlidersHorizontalIcon" size="20" />
        </div>

        <div class="min-w-0">
          <h2 class="font-semibold text-text">
            Filtros de búsqueda
          </h2>
          <p class="mt-1 text-sm text-text-muted">
            Filtra por nombre o tipo de archivo.
          </p>
        </div>
      </div>

      <ng-icon [svg]="lucideChevronDownIcon" size="20"
        class="shrink-0 text-text-muted transition-transform duration-200" [class.rotate-180]="filtersExpanded()" />
    </button>

    @if (filtersExpanded()) {
    <div class="mt-5 border-t border-border pt-5">
      <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
        <app-custom-textfield label="Buscar archivo" placeholder="Nombre del archivo..." [control]="searchControl"
          [icon]="lucideSearchIcon" [clearable]="true" />
      </div>
    </div>
    }
  </app-custom-card>

  @if (initialized() && items().length === 0 && !loading()) {
    <app-custom-alert type="info" title="Carpeta vacía"
      message="No hay archivos ni carpetas en este directorio." />
  }

  @if (items().length > 0) {
    <app-custom-infinite-scroll class="min-h-0 flex-1 overflow-y-auto pr-2" [loading]="loading()" [hasMore]="hasMore()"
      (loadMore)="loadMore()">

      <div class="flex flex-col gap-1 divide-y divide-border/20">
        @for (driveItem of items(); track driveItem.id) {
          <app-drive-item-row 
            [item]="driveItem"
            (shareClicked)="onShare($event)"
            (previewClicked)="onPreview($event)"
            (downloadClicked)="onDownload($event)"
            (deleteClicked)="onDelete($event)"
            (itemDoubleClicked)="onOpenItem($event)"
            (itemClicked)="onOpenItem($event)"
          />
        }
      </div>

    </app-custom-infinite-scroll>
  }

</div>
