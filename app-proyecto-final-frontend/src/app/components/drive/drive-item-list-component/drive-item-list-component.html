<div class="flex flex-col gap-1 divide-y divide-border/20 rounded-2xl border border-border bg-surface p-2">
  @for (item of items(); track item.id) {
    <app-drive-item-row 
      [item]="item" 
      [mode]="mode()"
      [isSelected]="selectedId() === item.id" 
      (shareClicked)="shareClicked.emit($event)"
      (previewClicked)="previewClicked.emit($event)" 
      (downloadClicked)="downloadClicked.emit($event)"
      (deleteClicked)="deleteClicked.emit($event)" 
      (renameClicked)="renameClicked.emit($event)"
      (moveClicked)="moveClicked.emit($event)"
      (restoreClicked)="restoreClicked.emit($event)"
      (permanentDeleteClicked)="permanentDeleteClicked.emit($event)"
      (itemDoubleClicked)="itemDoubleClicked.emit($event)" 
      (itemClicked)="onSelectItem(item)"
      (dragStartHandle)="onDragStart($event, item)" 
      class="transition-all duration-200 rounded-xl block"
      [class.scale-[1.02]]="mode() !== 'trash' && isTargetFolder(item)" 
      [class.bg-primary/15]="mode() !== 'trash' && isTargetFolder(item)"
      [class.border-primary]="mode() !== 'trash' && isTargetFolder(item)" 
      (dragover)="mode() !== 'trash' && onDragOver($event, item)"
      (dragleave)="mode() !== 'trash' && onDragLeave(item)" 
      (drop)="mode() !== 'trash' && onDrop($event, item)" 
    />
  }
</div>
