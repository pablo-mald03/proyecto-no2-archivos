<div class="relative">
    <app-custom-button [label]="collapsed() ? undefined : 'Nuevo'" ariaLabel="Nuevo" [icon]="lucidePlusIcon" size="lg"
        class="w-full" (clicked)="toggle()" />

    @if (open()) {
    <div role="menu"
        class="absolute left-0 top-full z-30 mt-2 w-56 overflow-hidden rounded-xl border border-border bg-surface p-1.5 shadow-2xl">
        <button type="button" role="menuitem" (click)="upload()"
            class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-text transition-colors hover:bg-surface-raised">
            <ng-icon [svg]="lucideUploadIcon" size="18" class="text-primary" />
            Subir archivo
        </button>
        <button type="button" role="menuitem" (click)="newFolder()"
            class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-text transition-colors hover:bg-surface-raised">
            <ng-icon [svg]="lucideFolderPlusIcon" size="18" class="text-primary" />
            Nueva carpeta
        </button>
    </div>
    }
</div>
