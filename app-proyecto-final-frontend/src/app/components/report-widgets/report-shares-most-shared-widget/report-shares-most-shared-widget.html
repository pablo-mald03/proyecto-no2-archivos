<app-report-widget-frame title="Archivos más compartidos" subtitle="Alcance de cada archivo" [icon]="lucideShareIcon"
    iconClass="bg-amber-950/40 text-amber-400" [loading]="loading()" [empty]="rows().length === 0"
    emptyMessage="Aún no hay archivos compartidos." [showViewMore]="showViewMore()" (viewMore)="viewMore.emit()">

    <div class="flex flex-col gap-2">

        @for (row of rows(); track row.id; let i = $index) {

        <div class="flex items-center gap-3 rounded-lg border px-2.5 py-2"
            [class]="i === 0 ? 'border-amber-500/40 bg-amber-500/5' : 'border-border bg-surface'">

            <span class="flex h-8 w-8 shrink-0 flex-col items-center justify-center rounded-lg"
                [class]="i === 0 ? 'bg-amber-950/50 text-amber-300' : 'bg-violet-950/40 text-violet-400'">
                <ng-icon [svg]="lucideFileIcon" size="14" />
            </span>

            <div class="min-w-0 flex-1">
                <p class="truncate text-xs font-semibold text-text" [title]="row.name">{{ row.name }}</p>
                <p class="truncate text-[11px] text-text-muted">&#64;{{ row.owner }}</p>
            </div>

            <div class="hidden shrink-0 items-center gap-1 sm:flex" [title]="row.count + ' usuarios con acceso'">
                @for (dot of dots; track dot) {
                <span class="reach-dot h-2 w-2 rounded-full transition-colors"
                    [class]="dot < row.filled ? 'bg-amber-400 shadow-[0_0_6px_rgba(251,191,36,0.6)]' : 'bg-surface-raised'"
                    [style.animation-delay.ms]="dot * 40"></span>
                }
            </div>

            <span class="w-9 shrink-0 text-right text-sm font-bold text-text tabular-nums">{{ row.count }}</span>

        </div>

        }

    </div>

</app-report-widget-frame>
