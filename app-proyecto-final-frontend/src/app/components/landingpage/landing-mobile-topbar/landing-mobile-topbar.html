<header class="
    sticky
    top-0
    z-40
    border-b
    border-border/60
    bg-background/90
    backdrop-blur-xl
  ">

  <div class="
      mx-auto
      flex
      h-20
      max-w-7xl
      items-center
      justify-between
      px-4
      sm:px-6
    ">

    <button type="button" class="
        flex
        shrink-0
        items-center
        gap-3
        transition-opacity
        hover:opacity-80
      ">

      <img src="/icon.ico" alt="Gestion Documental" class="h-9 w-9 rounded-lg" />

      <span class="
          text-lg
          font-bold
          tracking-tight
          text-primary
        ">
        Gestion Documental
      </span>

    </button>


    <div class="flex items-center gap-2">

      @if (isAuthenticated()) {

      <app-custom-button label="Ir al portal" [icon]="lucidePortalIcon" iconPosition="right" variant="primary"
        (clicked)="goToPortal()" />

      } @else {

      <app-custom-button label="Iniciar sesión" [icon]="lucideLogInIcon" iconPosition="right" variant="primary"
        (clicked)="login()" />

      }


      <button type="button" (click)="openMenu()" class="
          rounded-xl
          p-2.5
          text-text-muted
          transition-colors
          hover:bg-surface-raised
          hover:text-primary
        " aria-label="Abrir menú">

        <ng-icon [svg]="lucideMenuIcon" size="24" />

      </button>

    </div>

  </div>

</header>
