<header class="
    sticky
    top-0
    z-50
    border-b
    border-border/60
    bg-background/90
    backdrop-blur-xl
  ">

  <div class="
      mx-auto
      flex
      h-20
      max-w-7xl
      items-center
      px-6
      lg:px-8
    ">


    <button type="button" (click)="selectSection('home')" class="
    flex
    shrink-0
    items-center
    gap-3
    transition-opacity
    hover:opacity-80
  ">

      <img src="/icon.ico" alt="Gestion Documental" class="
      h-9
      w-9
      rounded-lg
    " />

      <span class="
    hidden
    text-xl
    font-bold
    tracking-tight
    text-primary
    sm:block
  ">
        Gestion Documental
      </span>

    </button>

    <nav class="
        mx-auto
        hidden
        items-center
        gap-8
        md:flex
      ">

      <button type="button" (click)="selectSection('home')" class="
          text-sm
          font-medium
          text-text-muted
          transition-colors
          hover:text-primary
        ">
        Inicio
      </button>


      <button type="button" (click)="selectSection('commitments')" class="
          text-sm
          font-medium
          text-text-muted
          transition-colors
          hover:text-primary
        ">
        Compromisos
      </button>


      <button type="button" (click)="selectSection('about')" class="
          text-sm
          font-medium
          text-text-muted
          transition-colors
          hover:text-primary
        ">
        Sobre nosotros
      </button>


      <button type="button" (click)="selectSection('contact')" class="
          text-sm
          font-medium
          text-text-muted
          transition-colors
          hover:text-primary
        ">
        Contacto
      </button>

    </nav>



    @if (isAuthenticated()) {

    <app-custom-button label="Ir al portal" [icon]="lucidePortalIcon" iconPosition="right" variant="primary"
      (clicked)="goToPortal()" />

    } @else {

    <app-custom-button label="Iniciar sesión" [icon]="lucideLogInIcon" iconPosition="right" variant="primary"
      (clicked)="login()" />

    }

  </div>

</header>
