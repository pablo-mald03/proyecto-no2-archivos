@if (open()) {

<div class="
      fixed
      inset-0
      z-50
      bg-black/60
      backdrop-blur-sm
    " (click)="closed.emit()"></div>


<aside class="
      fixed
      left-0
      top-0
      z-50
      flex
      h-full
      w-72
      flex-col
      border-r
      border-border
      bg-surface
      shadow-2xl
    ">

    <div class="
        flex
        h-20
        shrink-0
        items-center
        justify-between
        border-b
        border-border
        px-6
      ">

        <div class="flex items-center gap-3">

            <img src="/icon.ico" alt="Gestion Documental" class="h-9 w-9 rounded-lg" />

            <span class="
            text-lg
            font-bold
            tracking-tight
            text-primary
          ">
                Gestion Documental
            </span>

        </div>


        <button type="button" (click)="closed.emit()" class="
          rounded-lg
          p-2
          text-text-muted
          transition-colors
          hover:bg-surface-raised
          hover:text-text
        " aria-label="Cerrar menú">

            <ng-icon [svg]="lucideXIcon" size="22" />

        </button>

    </div>


    <nav class="flex-1 overflow-y-auto px-4 py-6">

        <div class="space-y-2">

            <button type="button" (click)="selectSection('home')" class="
    flex
    w-full
    items-center
    rounded-xl
    px-4
    py-3
    text-left
    text-sm
    font-medium
    text-text-muted
    transition-colors
    hover:bg-surface-raised
    hover:text-primary
  ">
                Inicio
            </button>

            <button type="button" (click)="selectSection('commitments')" class="
    flex
    w-full
    items-center
    rounded-xl
    px-4
    py-3
    text-left
    text-sm
    font-medium
    text-text-muted
    transition-colors
    hover:bg-surface-raised
    hover:text-primary
  ">
                Compromisos
            </button>

            <button type="button" (click)="selectSection('about')" class="
    flex
    w-full
    items-center
    rounded-xl
    px-4
    py-3
    text-left
    text-sm
    font-medium
    text-text-muted
    transition-colors
    hover:bg-surface-raised
    hover:text-primary
  ">
                Sobre nosotros
            </button>

            <button type="button" (click)="selectSection('contact')" class="
    flex
    w-full
    items-center
    rounded-xl
    px-4
    py-3
    text-left
    text-sm
    font-medium
    text-text-muted
    transition-colors
    hover:bg-surface-raised
    hover:text-primary
  ">
                Contacto
            </button>

        </div>

    </nav>


    <div class="border-t border-border p-4">

        <p class="px-2 text-xs text-text-subtle">
            Gestión de inventarios simplificada.
        </p>

    </div>

</aside>

}
