<div class="flex min-h-[80vh] w-full flex-col items-center justify-center p-6 text-center">
  
  <div class="relative flex flex-col items-center max-w-md w-full">
    
    <div class="relative mb-6 flex h-24 w-24 items-center justify-center rounded-3xl bg-error/10 text-primary/100 shadow-xl shadow-error/5 ring-8 ring-error/5">
      <ng-icon [svg]="lucideShieldAlertIcon" size="48" />
    </div>

    <h1 class="text-3xl font-extrabold tracking-tight text-primary sm:text-4xl">
      Sin autorización
    </h1>
    
    <p class="mt-3 text-sm text-text-muted leading-relaxed">
      Lo sentimos, pero no tienes los permisos necesarios para acceder a este recurso o la página solicitada no existe.
    </p>

    <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3 w-full">
      
      <app-custom-button 
        label="Regresar" 
        variant="ghost" 
        [icon]="lucideArrowLeftIcon" 
        class="w-full sm:w-auto"
        (clicked)="goBack()" 
      />

      <app-custom-button 
        label="Ir al inicio" 
        [icon]="lucideHomeIcon" 
        class="w-full sm:w-auto"
        (clicked)="goHome()" 
      />
      
    </div>

  </div>

</div>
