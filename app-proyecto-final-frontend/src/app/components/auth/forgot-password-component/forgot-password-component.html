<div class="space-y-5">

  <div class="text-center">

    <h1
      class="
        text-2xl
        font-bold
        text-text
      "
    >
      Recuperar contraseña
    </h1>

    <p
      class="
        mt-2
        text-sm
        leading-6
        text-text-muted
      "
    >
      Ingresa tus datos para establecer una nueva contraseña.
    </p>

  </div>


  <form
    class="space-y-5"
    [formGroup]="loginForm"
    (ngSubmit)="recoverPassword()"
  >


    <app-custom-textfield
      label="Username"
      placeholder="Ingrese su username"
      [control]="controls.username"
      [icon]="lucideIdCardIcon"
    />


    <app-custom-textfield
      label="Correo electrónico"
      placeholder="correo@empresa.com"
      type="email"
      [control]="controls.email"
      [icon]="lucideMailIcon"
    />


    <app-custom-textfield
      label="Nueva contraseña"
      placeholder="••••••••"
      type="password"
      [control]="controls.newPassword"
      [icon]="lucideLockIcon"
    />


    <app-custom-textfield
      label="Confirmar nueva contraseña"
      placeholder="••••••••"
      type="password"
      [control]="controls.confirmPassword"
      [icon]="lucideLockIcon"
    />


    <app-custom-button
      label="Cambiar contraseña"
      type="submit"
      class="w-full"
      [loading]="loading()"
    />

  </form>


  <div class="text-center">

    <button
      type="button"
      (click)="goToLogin()"
      class="
        text-sm
        font-medium
        text-primary
        transition-opacity
        hover:opacity-80
      "
    >
      Volver al inicio de sesión
    </button>

  </div>

</div>
