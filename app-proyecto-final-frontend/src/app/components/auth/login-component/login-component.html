<div class="space-y-6">

    <div class="text-center">
        <h1 class="text-2xl font-bold text-text">Iniciar sesión</h1>
        <p class="mt-2 text-sm text-text-muted">Ingresa tus credenciales para acceder a tus documentos</p>
    </div>

    <form class="space-y-5" [formGroup]="loginForm" (ngSubmit)="login()">

        <app-custom-textfield label="Correo electrónico" placeholder="correo@empresa.com" type="email"
            [control]="controls.email" [icon]="lucideMailIcon" />

        <app-custom-textfield label="Contraseña" placeholder="••••••••" type="password" [control]="controls.password"
            [icon]="lucideLockIcon" />

        <div class="flex justify-end">
            <button type="button" (click)="goToForgotPassword()"
                class="text-sm font-medium text-primary transition-opacity hover:opacity-80">
                ¿Olvidaste tu contraseña?
            </button>
        </div>

        <app-custom-button label="Iniciar sesión" type="submit" class="w-full" [loading]="loading()" />

    </form>

    <div class="flex items-center gap-4 text-xs text-text-subtle">
        <span class="h-px flex-1 bg-border"></span>
        <span>¿Primera vez aquí?</span>
        <span class="h-px flex-1 bg-border"></span>
    </div>

    <p class="text-center text-sm text-text-muted">
        ¿No tienes cuenta?
        <button type="button" (click)="goToRegister()"
            class="font-medium text-primary transition-opacity hover:opacity-80">Crear cuenta</button>
    </p>

</div>
