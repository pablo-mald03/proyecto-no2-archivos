<nav class="
        flex-1
        overflow-y-auto
        overflow-x-hidden
        px-3
        py-4
    ">

    <div class="space-y-1">

        @for (
        option of options();
        track option.route ?? option.label
        ) {

        <app-sidebar-item [option]="option" [collapsed]="collapsed()" (optionSelected)="
                    optionSelected.emit()
                " />

        }

    </div>

</nav>
