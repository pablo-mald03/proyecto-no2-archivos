<div class="flex h-full min-h-0 flex-col gap-6">

    <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <button type="button" (click)="goBack()" aria-label="Volver"
                class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-border bg-surface text-text-muted transition-colors hover:border-primary/50 hover:text-primary">
                <ng-icon [svg]="lucideArrowLeftIcon" size="18" />
            </button>
            <div>
                <h1 class="text-2xl font-bold text-text">Usuarios con mayor almacenamiento</h1>
                <p class="mt-1 text-sm text-text-muted">
                    Podio de los usuarios que consumen más espacio, con el avance de su cuota asignada.
                </p>
            </div>
        </div>
    </div>

    <app-custom-card [hoverable]="false">
        <app-report-users-top-filters (filtersChange)="onFiltersChange($event)" />
    </app-custom-card>

    @if (users().length > 0) {
    <app-report-users-kpi-strip [items]="kpis()" />
    }

    <app-custom-card [hoverable]="true">

        @if (loading() && users().length === 0) {
        <div class="flex items-center justify-center py-12 text-sm text-text-muted">
            Cargando reporte...
        </div>
        } @else if (users().length === 0) {
        <app-custom-alert type="info" title="Sin datos" message="No hay usuarios con almacenamiento para los filtros seleccionados." />
        } @else {
        <app-report-users-podium [entries]="entries()" />
        }

    </app-custom-card>

</div>
