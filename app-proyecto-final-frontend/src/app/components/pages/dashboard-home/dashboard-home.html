<div class="flex h-full min-h-0 flex-col gap-6">

  <div>
    <h1 class="text-2xl font-bold text-text">Dashboard</h1>
    <p class="mt-1 text-sm text-text-muted">Resumen general de tu sistema.</p>
  </div>

  <div class="flex flex-wrap justify-center gap-6">

    @if (canSeeTopFileCount()) {
    <div class="flex w-full xl:w-[calc(50%-0.75rem)]">
      <app-report-users-top-file-count-widget class="w-full" [users]="topFileCount()" [loading]="topFileCountLoading()"
        [limit]="PREVIEW_LIMIT" [showViewMore]="true" (viewMore)="goToTopFileCountReport()" />
    </div>
    }

    @if (canSeeTopStorage()) {
    <div class="flex w-full xl:w-[calc(50%-0.75rem)]">
      <app-report-users-top-storage-widget class="w-full" [users]="topStorage()" [loading]="topStorageLoading()"
        [limit]="PREVIEW_LIMIT" [showViewMore]="true" (viewMore)="goToTopStorageReport()" />
    </div>
    }

    @if (canSeeMostShared()) {
    <div class="flex w-full xl:w-[calc(50%-0.75rem)]">
      <app-report-shares-most-shared-widget class="w-full" [files]="mostShared()" [loading]="mostSharedLoading()"
        [limit]="PREVIEW_LIMIT" [showViewMore]="true" (viewMore)="goToMostSharedReport()" />
    </div>
    }

    @if (canSeeTopFolders()) {
    <div class="flex w-full xl:w-[calc(50%-0.75rem)]">
      <app-report-folders-most-files-widget class="w-full" [folders]="topFolders()" [loading]="topFoldersLoading()"
        [limit]="PREVIEW_LIMIT" [showViewMore]="true" (viewMore)="goToTopFoldersReport()" />
    </div>
    }

    @if (!canSeeAnyWidget()) {
    <div class="w-full">
      <app-custom-alert type="info" title="Sin contenido disponible"
        message="Tu rol actual no tiene acceso a ningún widget del dashboard." />
    </div>
    }

  </div>

</div>
