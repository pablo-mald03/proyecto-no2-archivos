<section class="space-y-8 pb-6">

    <header>
        <h1 class="text-2xl font-bold text-text">Hola, {{ firstName() }}</h1>
        <p class="mt-1 text-sm text-text-muted">Gestiona tus archivos</p>
    </header>

    <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
        @for (shortcut of shortcuts; track shortcut.route) {
        <a [routerLink]="shortcut.route" class="block">
            <app-custom-card bodyClass="flex items-center gap-4 p-5 hover:border-primary/50 transition-colors">
                <div class="rounded-xl bg-primary/10 p-3 text-primary">
                    <ng-icon [svg]="shortcut.icon" size="22" />
                </div>
                <span class="font-medium text-text">{{ shortcut.label }}</span>
            </app-custom-card>
        </a>
        }
    </div>

    <div class="space-y-4 pt-4">
        <div class="flex items-center justify-between">
            <h2 class="text-lg font-semibold text-text">Archivos recientes</h2>
            <a routerLink="/drive/files" class="text-xs font-semibold text-primary hover:underline">
                Ver todos
            </a>
        </div>

        @if (recentItems().length > 0) {
        <div class="flex flex-col gap-1 divide-y divide-border/20 rounded-2xl border border-border bg-surface p-2">
            @for (item of recentItems(); track item.id) {
            <app-drive-item-row [item]="item" (shareClicked)="onShare($event)" (previewClicked)="onPreview($event)"
                (downloadClicked)="onDownload($event)" (deleteClicked)="onDelete($event)"
                (itemDoubleClicked)="onOpenItem($event)" (itemClicked)="onOpenItem($event)" />
            }
        </div>
        } @else {
        <p class="text-sm text-text-muted">No hay archivos recientes para mostrar.</p>
        }
    </div>

</section>
