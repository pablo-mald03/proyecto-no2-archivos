<div class="flex h-full min-h-0 flex-col gap-6">

    <div>
        <h1 class="text-2xl font-bold text-text">Logs</h1>
        <p class="mt-1 text-sm text-text-muted">Historial de actividad registrada en el sistema.</p>
    </div>

    <app-custom-card [hoverable]="false">

        <div class="mb-5 grid gap-4 sm:grid-cols-3">

            <app-custom-dropdown label="Módulo" placeholder="Todos los módulos" [options]="modules()" optionKey="value"
                optionLabel="label" [control]="moduleFilterControl" [clearable]="true" />

            <app-custom-datepicker label="Desde" [control]="fromDateControl" [max]="toDate()" [clearable]="true" />

            <app-custom-datepicker label="Hasta" [control]="toDateControl" [min]="fromDate()" [clearable]="true" />

        </div>

        <app-custom-table [columns]="logColumns" [data]="logs()" [loading]="loading()" [hoverable]="true"
            [striped]="true" [numbered]="true" [startIndex]="page() * size" headerVariant="primary"
            emptyMessage="No hay registros que coincidan con los filtros.">

            <ng-template appTableCell="createdAt" let-row>
                {{ row.createdAt | date: 'dd/MM/yyyy HH:mm' }}
            </ng-template>

            <ng-template appTableCell="module" let-row>
                <span class="rounded-full bg-surface-raised px-2 py-0.5 text-xs font-medium">
                    {{ row.module }}
                </span>
            </ng-template>

        </app-custom-table>

        <div class="mt-4">
            <app-custom-pagination [page]="page()" [totalPages]="totalPages()" [totalElements]="totalElements()"
                [loading]="loading()" (pageChange)="onPageChange($event)" />
        </div>

    </app-custom-card>

</div>
