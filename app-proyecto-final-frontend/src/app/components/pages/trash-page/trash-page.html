<div class="flex h-full min-h-0 flex-col gap-6">

  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div class="flex items-center gap-3">
      <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-error/10 text-error">
        <ng-icon [svg]="lucideTrash2Icon" size="24" />
      </div>
      <div>
        <h1 class="text-xl font-bold text-text">Papelera</h1>
        <p class="text-xs text-text-muted">
          Restaura tus archivos o elimínalos definitivamente
        </p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <app-custom-button label="Actualizar" variant="secondary" size="md" [icon]="lucideRotateCcwIcon" [bordered]="true"
        (clicked)="loadTrashItems()" />
    </div>
  </div>

  <app-custom-alert type="info"
    message="Puedes restaurar los elementos de la papelera en cualquier momento o eliminarlos permanentemente para liberar espacio." />

  <app-custom-card [hoverable]="false">
    <button type="button" class="flex w-full items-center justify-between gap-3 text-left"
      [attr.aria-expanded]="filtersExpanded()" (click)="filtersExpanded.set(!filtersExpanded())">

      <div class="flex min-w-0 items-center gap-3">
        <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-primary/10 text-primary">
          <ng-icon [svg]="lucideSlidersHorizontalIcon" size="16" />
        </div>

        <div class="min-w-0">
          <h3 class="text-sm font-semibold text-text">
            Filtros
          </h3>
        </div>
      </div>

      <ng-icon [svg]="lucideChevronDownIcon" size="18"
        class="shrink-0 text-text-muted transition-transform duration-200" [class.rotate-180]="filtersExpanded()" />
    </button>

    @if (filtersExpanded()) {
    <div class="mt-4 border-t border-border pt-4">
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <app-custom-textfield label="Buscar en papelera" placeholder="Nombre del elemento..." [control]="searchControl"
          [icon]="lucideSearchIcon" [clearable]="true" />

        <app-custom-dropdown label="Tipo de elemento" [options]="typeOptions" optionKey="value" optionLabel="label"
          [control]="typeFilterControl" />

        <app-custom-dropdown label="Ordenar por" [options]="sortOptions" optionKey="value" optionLabel="label"
          [control]="sortOptionControl" />
      </div>

      <div class="mt-4 flex justify-end">
        <app-custom-button label="Limpiar filtros" variant="ghost" size="sm" [icon]="lucideRotateCcwIcon"
          (clicked)="resetFilters()" />
      </div>
    </div>
    }
  </app-custom-card>

  @switch (emptyStateType()) {
  @case ('loading') {
  <app-empty-state-component [loading]="true" loadingText="Cargando papelera..." />
  }

  @case ('trash-empty') {
  <app-empty-state-component title="La papelera está vacía"
    description="No hay elementos en la papelera. Los archivos o carpetas que elimines aparecerán aquí.">
    <div class="flex items-center gap-2">
      <app-custom-button label="Actualizar" variant="secondary" size="sm" [icon]="lucideRotateCcwIcon" [bordered]="true"
        (clicked)="loadTrashItems()" />
    </div>
  </app-empty-state-component>
  }

  @case ('search-empty') {
  <app-empty-state-component title="Sin resultados"
    description="No encontramos ningún elemento en la papelera que coincida con los filtros seleccionados.">
    <div class="flex items-center gap-2">
      <app-custom-button label="Restablecer filtros" variant="secondary" size="sm" [icon]="lucideRotateCcwIcon"
        [bordered]="true" (clicked)="resetFilters()" />
    </div>
  </app-empty-state-component>
  }

  @default {
  <div class="flex flex-col gap-2 min-h-0 flex-1">
    <div class="flex items-center justify-between px-6 py-2 text-xs font-semibold text-text-muted">
      <div class="flex-1">Nombre</div>
      <div class="hidden sm:block w-36">Fecha de eliminación</div>
      <div class="hidden md:block w-24 text-right">Tamaño</div>
      <div class="w-16 text-right">Acciones</div>
    </div>

    <app-drive-item-list-component [items]="displayedItems()" mode="trash" (restoreClicked)="onRestoreItem($event)"
      (permanentDeleteClicked)="onPermanentDeleteItem($event)" />
  </div>
  }
  }

  <app-custom-confirm-dialog [open]="confirmModalOpen()" [type]="dialogType()" [title]="dialogTitle()"
    [message]="dialogMessage()" [confirmLabel]="dialogConfirmLabel()" [loading]="confirmModalLoading()"
    (confirmed)="handleConfirm()" (cancelled)="closeConfirmDialog()" />

</div>
