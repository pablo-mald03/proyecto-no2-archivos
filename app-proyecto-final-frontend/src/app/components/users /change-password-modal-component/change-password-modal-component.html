<app-custom-modal-component
  [isOpen]="isOpen()"
  title="Cambiar contraseña"
  subtitle="Asegúrate de que tu cuenta utilice una contraseña segura para mantenerla protegida."
  (closed)="closeModal()"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

    <app-custom-textfield
      label="Contraseña actual"
      placeholder="••••••••"
      type="password"
      [control]="controls.currentPassword"
    />

    <app-custom-textfield
      label="Nueva contraseña"
      placeholder="••••••••"
      type="password"
      [control]="controls.newPassword"
    />

    <app-custom-textfield
      label="Confirmar nueva contraseña"
      placeholder="••••••••"
      type="password"
      [control]="controls.confirmPassword"
    />

    <div modal-actions class="flex justify-end gap-3">
      <app-custom-button
        label="Cancelar"
        variant="secondary"
        type="button"
        (click)="closeModal()"
      />
      <app-custom-button
        label="Actualizar contraseña"
        type="submit"
        [loading]="saving()"
      />
    </div>

  </form>
</app-custom-modal-component>
