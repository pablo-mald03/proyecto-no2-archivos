<div class="grid gap-3 sm:grid-cols-3">
    @for (item of items(); track item.label) {
    <div class="rounded-xl border border-border bg-surface px-4 py-3">
        <p class="text-[11px] font-medium uppercase tracking-wide text-text-muted">{{ item.label }}</p>
        <p class="mt-1 text-2xl font-bold text-text tabular-nums">{{ item.value }}</p>
        @if (item.hint) {
        <p class="mt-0.5 truncate text-xs text-text-muted">{{ item.hint }}</p>
        }
    </div>
    }
</div>
