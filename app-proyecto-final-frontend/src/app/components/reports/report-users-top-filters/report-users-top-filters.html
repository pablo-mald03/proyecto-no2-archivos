<form [formGroup]="form" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4" (submit)="$event.preventDefault()">

    <label class="flex flex-col gap-1.5">
        <span class="text-xs font-medium text-text-muted">Buscar usuario</span>
        <div class="relative">
            <ng-icon [svg]="lucideSearchIcon" size="16"
                class="pointer-events-none absolute left-3 top-1/2 inline-flex -translate-y-1/2 text-text-muted" />
            <input type="text" formControlName="search" maxlength="100" placeholder="Buscar..."
                class="w-full rounded-lg border border-border bg-surface py-2 pl-9 pr-3 text-sm text-text outline-none transition-colors placeholder:text-text-muted focus:border-primary/60" />
        </div>
    </label>

    <label class="flex flex-col gap-1.5">
        <span class="text-xs font-medium text-text-muted">Desde</span>
        <input type="date" formControlName="dateFrom" [attr.max]="form.controls.dateTo.value || null"
            class="w-full rounded-lg border border-border bg-surface px-3 py-2 text-sm text-text outline-none transition-colors focus:border-primary/60" />
    </label>

    <label class="flex flex-col gap-1.5">
        <span class="text-xs font-medium text-text-muted">Hasta</span>
        <input type="date" formControlName="dateTo" [attr.min]="form.controls.dateFrom.value || null"
            class="w-full rounded-lg border border-border bg-surface px-3 py-2 text-sm text-text outline-none transition-colors focus:border-primary/60" />
    </label>

    <div class="flex items-end">
        <button type="button" (click)="reset()" [disabled]="!hasFilters()"
            class="flex h-[38px] items-center gap-2 rounded-lg border border-border bg-surface px-3 text-sm text-text-muted transition-colors hover:border-primary/50 hover:text-primary disabled:cursor-not-allowed disabled:opacity-40">
            <ng-icon [svg]="lucideResetIcon" size="16" />
            Limpiar filtros
        </button>
    </div>

</form>
