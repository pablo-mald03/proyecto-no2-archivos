<div class="flex flex-col gap-2">

    @for (folder of folders(); track folder.folderId; let i = $index) {

    <div
        class="flex items-center gap-4 rounded-lg border border-border bg-surface px-4 py-3 transition-colors hover:border-primary/40 hover:bg-surface-raised">

        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-xs font-bold"
            [class]="rankClass(rankFor(i))">
            {{ rankFor(i) }}
        </span>

        <div class="min-w-0 flex-1">
            <p class="truncate font-medium text-text" [title]="folder.folderName">{{ folder.folderName }}</p>
            <p class="truncate text-xs text-text-muted">
                &#64;{{ folder.ownerUsername }} · {{ folder.ownerEmail }}
            </p>
        </div>

        <span class="hidden shrink-0 text-xs text-text-muted tabular-nums md:block">
            {{ folder.createdAt | date:'dd/MM/yyyy' }}
        </span>

        <div class="hidden w-40 shrink-0 sm:block">
            <div class="relative h-2 overflow-hidden rounded-full bg-surface-raised">
                <div class="absolute inset-y-0 left-0 rounded-full bg-gradient-to-r from-amber-500 to-yellow-300 transition-all duration-700"
                    [style.width.%]="barWidth(folder)"></div>
            </div>
        </div>

        <span class="w-16 shrink-0 text-right text-sm font-bold text-text tabular-nums">
            {{ folder.fileCount }}
        </span>

    </div>

    }

</div>
