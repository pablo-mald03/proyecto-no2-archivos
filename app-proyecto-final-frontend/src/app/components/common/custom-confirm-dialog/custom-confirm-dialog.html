@if (open()) {

<div class="
            fixed
            inset-0
            z-50
            flex
            items-center
            justify-center
            bg-black/50
            p-4
            backdrop-blur-sm
        " role="dialog" aria-modal="true" (click)="cancel()">

    <div class="
                w-full
                max-w-md
                rounded-xl
                border
                bg-surface
                p-5
                shadow-xl
                sm:p-6
            " [class.border-yellow-800/80]="type() === 'warning'" [class.border-red-800/80]="type() === 'danger'"
        [class.border-green-800/80]="type() === 'success'" (click)="$event.stopPropagation()">


        <div class="flex items-start gap-4">

            <div class="
                        flex
                        h-10
                        w-10
                        shrink-0
                        items-center
                        justify-center
                        rounded-lg
                    " [class.bg-yellow-950/60]="type() === 'warning'" [class.text-yellow-400]="type() === 'warning'"
                [class.bg-red-950/60]="type() === 'danger'" [class.text-red-400]="type() === 'danger'"
                [class.bg-green-950/60]="type() === 'success'" [class.text-green-400]="type() === 'success'">

                @if (type() === 'warning' || type() === 'danger') {

                <ng-icon [svg]="lucideAlertTriangleIcon" size="20" />

                } @else {

                <ng-icon [svg]="lucideCheckIcon" size="20" />

                }

            </div>


            <div class="min-w-0 flex-1">

                <h2 class="text-base font-semibold text-text">
                    {{ title() }}
                </h2>

                <p class="mt-1 text-sm leading-6 text-text-muted">
                    {{ message() }}
                </p>

            </div>


            <button type="button" class="
                        shrink-0
                        rounded-md
                        p-1
                        text-text-muted
                        transition-colors
                        hover:bg-surface-raised
                        hover:text-text
                    " aria-label="Cerrar" [disabled]="loading()" (click)="cancel()">

                <ng-icon [svg]="lucideXIcon" size="18" />

            </button>

        </div>



        <div class="mt-6 flex justify-end gap-3">

            <app-custom-button [label]="cancelLabel()" variant="ghost" size="sm" [disabled]="loading()"
                (clicked)="cancel()" [bordered]="true" />

            <app-custom-button [label]="confirmLabel()" [variant]="
                        type() === 'danger'
                            ? 'danger'
                            : type() === 'success'
                                ? 'success'
                                : 'secondary'
                    " size="sm" [loading]="loading()" (clicked)="confirm()" [bordered]="true" />

        </div>

    </div>

</div>

}
