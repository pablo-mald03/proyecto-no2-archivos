<div
    class="flex flex-col items-center justify-center py-12 px-4 text-center rounded-2xl border border-dashed border-border/60 bg-surface/30 backdrop-blur-sm transition-all min-h-55">

    @if (loading()) {
    <div class="flex flex-col items-center justify-center space-y-3">
        <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-primary/10 text-primary">
            <ng-icon [svg]="lucideLoader2Icon" size="28" class="animate-spin text-primary" />
        </div>
        <p class="text-sm font-medium text-text-muted animate-pulse">
            {{ loadingText() }}
        </p>
    </div>
    } @else {
    <div
        class="mb-3 flex h-14 w-14 items-center justify-center rounded-2xl bg-primary/10 text-primary shadow-sm ring-8 ring-primary/5">
        <ng-icon [svg]="icon()" size="28" />
    </div>

    <h3 class="text-base font-semibold text-text">
        {{ title() }}
    </h3>

    @if (description()) {
    <p class="mt-1 max-w-sm text-xs leading-relaxed text-text-muted">
        {{ description() }}
    </p>
    }

    <div class="mt-4 flex items-center gap-2 empty:hidden">
        <ng-content />
    </div>
    }

</div>
