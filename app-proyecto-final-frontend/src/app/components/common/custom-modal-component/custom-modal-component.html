@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto bg-surface/75 p-4 backdrop-blur-sm transition-all duration-300 animate-in fade-in"
    (click)="onBackdropClick($event)"
  >
    <div
      #modalContainer
      [class]="'relative w-full rounded-2xl border border-border/80 bg-surface-raised p-6 shadow-2xl transition-all duration-300 hover:border-primary/40 hover:shadow-[0_0_25px_rgba(var(--color-primary-rgb,59,130,246),0.12)] active:border-primary/30 ' + widthClass"
    >
      <div class="flex items-start justify-between gap-4 border-b border-border/50 pb-4">
        <div>
          @if (title()) {
            <h2 class="text-lg font-bold text-text">
              {{ title() }}
            </h2>
          }
          @if (subtitle()) {
            <p class="mt-0.5 text-xs text-text-muted">
              {{ subtitle() }}
            </p>
          }
        </div>

        <button
          type="button"
          (click)="close()"
          aria-label="Cerrar modal"
          class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg border border-border/60 bg-surface text-text-muted transition-colors hover:border-primary/50 hover:bg-primary/5 hover:text-primary active:scale-95"
        >
          <ng-icon [svg]="lucideXIcon" size="16" />
        </button>
        
      </div>

      <div class="py-4">
        <ng-content></ng-content>
      </div>

      <div class="mt-2 border-t border-border/50 pt-4">
        <ng-content select="[modal-actions]"></ng-content>
      </div>
    </div>
  </div>
}
